services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindecho
      POSTGRES_PASSWORD: mindecho
      POSTGRES_DB: mindecho
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindecho"]
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    environment:
      SERVICES: s3,bedrock
      DEFAULT_REGION: ap-northeast-1
    ports:
      - "4566:4566"

volumes:
  pgdata:
